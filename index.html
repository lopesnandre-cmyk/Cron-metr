<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cronómetro">
<meta name="theme-color" content="#F4EDE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1310" media="(prefers-color-scheme: dark)">
<title>Cronómetro de produção</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
<style>
:root{
  --bg:#F4EDE7; --bg2:#E6DAD0; --painel:rgba(255,250,246,.92);
  --glass:rgba(255,255,255,.52); --glass-2:rgba(255,255,255,.72); --linha:rgba(110,55,25,.15);
  --ink:#2A1C16; --muted:#7A675C; --brasa:#E2611F; --paprika:#C2361F; --ouro:#B4740E; --frio:#4F6E8A; --ok:#1C8550;
  --brilho:.22; --fumo-a:rgba(232,100,31,.20); --fumo-b:rgba(194,54,31,.12); --fumo-c:rgba(79,110,138,.14);
  --sombra:0 24px 60px -34px rgba(90,40,15,.45);
  --f-digits:"Bahnschrift","Avenir Next Condensed","DIN Condensed","DIN Alternate","Roboto Condensed","Arial Narrow",sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1310; --bg2:#0E0A08; --painel:rgba(28,20,17,.9);
    --glass:rgba(255,232,215,.045); --glass-2:rgba(255,232,215,.075); --linha:rgba(255,190,150,.14);
    --ink:#F7EEE8; --muted:#B6A59A; --brasa:#FF8A3D; --paprika:#F0543B; --ouro:#FFC872; --frio:#9DB6CC; --ok:#7BE0A8;
    --brilho:.55; --fumo-a:rgba(255,120,50,.24); --fumo-b:rgba(240,84,59,.15); --fumo-c:rgba(120,150,185,.12);
    --sombra:0 30px 80px -40px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1310; --bg2:#0E0A08; --painel:rgba(28,20,17,.9);
  --glass:rgba(255,232,215,.045); --glass-2:rgba(255,232,215,.075); --linha:rgba(255,190,150,.14);
  --ink:#F7EEE8; --muted:#B6A59A; --brasa:#FF8A3D; --paprika:#F0543B; --ouro:#FFC872; --frio:#9DB6CC; --ok:#7BE0A8;
  --brilho:.55; --fumo-a:rgba(255,120,50,.24); --fumo-b:rgba(240,84,59,.15); --fumo-c:rgba(120,150,185,.12);
  --sombra:0 30px 80px -40px rgba(0,0,0,.9);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg2);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brasa);outline-offset:3px}
[hidden]{display:none!important}

/* fundo: fumo e grelha */
.fumo{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(130% 85% at 50% -5%,var(--bg) 0%,var(--bg2) 75%)}
.fumo i{position:absolute;border-radius:50%;filter:blur(50px)}
.fumo i:nth-child(1){width:80vmax;height:80vmax;left:-30vmax;top:-35vmax;background:radial-gradient(circle,var(--fumo-a),transparent 62%)}
.fumo i:nth-child(2){width:70vmax;height:70vmax;right:-35vmax;top:15vh;background:radial-gradient(circle,var(--fumo-b),transparent 62%)}
.fumo i:nth-child(3){width:75vmax;height:75vmax;left:0;bottom:-45vmax;background:radial-gradient(circle,var(--fumo-c),transparent 62%)}
.fumo::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--linha) 1px,transparent 1px),linear-gradient(90deg,var(--linha) 1px,transparent 1px);background-size:44px 44px;opacity:.45;-webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 20%,#000,transparent);mask-image:radial-gradient(ellipse 70% 55% at 50% 20%,#000,transparent)}
@media (prefers-reduced-motion: no-preference){
  .fumo i:nth-child(1){animation:deriva 46s ease-in-out infinite alternate}
  .fumo i:nth-child(2){animation:deriva 58s ease-in-out infinite alternate-reverse}
  .fumo i:nth-child(3){animation:deriva 52s ease-in-out infinite alternate}
  @keyframes deriva{from{transform:translate(0,0) scale(1)}to{transform:translate(8vmax,6vmax) scale(1.12)}}
}

/* topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:linear-gradient(var(--painel),transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--painel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topo h1{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-digits);font-stretch:condensed;font-weight:500;font-size:21px;letter-spacing:.02em}
.topo h1::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--paprika),var(--ouro));box-shadow:0 0 14px var(--brasa)}
main{max-width:980px;margin:0 auto;padding:10px 16px calc(120px + env(safe-area-inset-bottom,0px))}

/* botões */
.btn{min-height:54px;padding:0 20px;border-radius:999px;border:1px solid var(--linha);background:var(--glass-2);color:var(--ink);font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--paprika),var(--brasa));border-color:transparent;color:#fff;box-shadow:0 12px 30px -12px var(--paprika)}
.btn.perigo{background:transparent;border-color:transparent;color:var(--paprika)}
.btn:disabled{opacity:.4;cursor:default}
.btn.largo{width:100%}
.txt{background:none;border:0;padding:8px 4px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--linha);text-underline-offset:4px}
.novo{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;border-radius:999px;border:1px solid var(--linha);background:var(--glass);color:var(--ink);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:17px;font-weight:700;cursor:pointer;margin:4px 0 18px;box-shadow:var(--sombra)}
.novo::before{content:"+";display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--paprika),var(--brasa));color:#fff;font-size:24px;font-weight:400;line-height:1;box-shadow:0 0 22px rgba(255,120,50,var(--brilho))}

/* cronómetros */
.lista{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.lista.varios{grid-template-columns:1fr 1fr}}
.crono{position:relative;background:var(--glass);border:1px solid var(--linha);border-radius:30px;padding:18px 18px 20px;-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);box-shadow:var(--sombra)}
.crono.corre{border-color:rgba(255,138,61,.35);box-shadow:var(--sombra),0 0 60px -30px rgba(255,110,40,var(--brilho))}
.crono .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.crono h2{margin:0;font-size:20px;line-height:1.2;letter-spacing:-.01em}
.crono .etapa{margin:2px 0 0;color:var(--muted);font-size:15px}

/* mostrador de cronógrafo */
.mostrador{position:relative;width:min(78vw,330px);aspect-ratio:1/1;margin:4px auto 10px;container-type:inline-size}
.lista.varios .mostrador{width:min(62vw,260px)}
.anel{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.anel .disco{fill:var(--glass-2);stroke:var(--linha);stroke-width:1}
.anel .marcas line{stroke:var(--linha);stroke-width:1.2;stroke-linecap:round}
.anel .marcas line.maior{stroke:var(--muted);stroke-width:1.6;opacity:.55}
.anel .pista{fill:none;stroke:var(--linha);stroke-width:3}
.anel .arco{fill:none;stroke:url(#g-brasa);stroke-width:5;stroke-linecap:round}
.anel .ponta{fill:var(--ouro)}
.crono.corre .anel{filter:drop-shadow(0 0 9px rgba(255,120,50,var(--brilho)))}
.crono.pausa .anel .arco{stroke:var(--frio)}
.crono.pausa .anel .ponta{fill:var(--frio)}
.vazio-crono .anel .ponta{fill:var(--muted)}

.digits{font-family:var(--f-digits);font-stretch:condensed;font-weight:300;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.01em;white-space:nowrap}
.digits .mm{background:linear-gradient(180deg,var(--ink) 40%,var(--ouro) 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
.digits .dec{font-size:.4em;color:var(--brasa);margin-left:.06em}
.mostrador .digits{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;font-size:64px;font-size:21cqw}
.mostrador .digits .dec{align-self:center;margin-top:.9em}
.mostrador .digits.longo{font-size:48px;font-size:15cqw}
.crono.pausa .digits .mm,.vazio-crono .digits .mm{background:none;color:var(--muted)}
.crono.pausa .digits .dec{color:var(--frio)}

.crono .estado{display:flex;align-items:center;gap:8px;width:max-content;margin:0 auto;padding:5px 13px;border-radius:999px;background:rgba(255,120,50,.13);color:var(--brasa);font-size:13px;font-weight:700}
.crono .estado::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.crono.pausa .estado{background:rgba(120,150,185,.15);color:var(--frio)}
@media (prefers-reduced-motion: no-preference){.crono.corre .estado::before{animation:pulsa 1.6s ease-in-out infinite}@keyframes pulsa{50%{opacity:.35}}}
.meta{list-style:none;margin:12px 0 16px;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.meta li{padding:4px 11px;border-radius:999px;border:1px solid var(--linha);color:var(--muted);font-size:13px}
.crono .acoes{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.vazio-crono{text-align:center;padding:8px 16px 24px;color:var(--muted)}
.vazio-crono p{max-width:30ch;margin:0 auto}

/* registos */
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 8px}
.barra h2{margin:0;font-family:var(--f-digits);font-stretch:condensed;font-weight:500;font-size:26px}
.barra .acoes{display:flex;gap:8px;flex-wrap:wrap}
.dia{font-size:14px;margin:24px 4px 8px;color:var(--muted);font-weight:600}
.dia:first-letter{text-transform:uppercase}
.regs{list-style:none;margin:0;padding:0;background:var(--glass);border:1px solid var(--linha);border-radius:22px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow:hidden}
.regs li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px;border-top:1px solid var(--linha)}
.regs li:first-child{border-top:0}
.r-info strong{display:block}
.r-info span{display:block;color:var(--muted);font-size:14px}
.r-tempo{font-family:var(--f-digits);font-stretch:condensed;font-weight:300;font-variant-numeric:tabular-nums;font-size:32px;line-height:1;text-align:right;align-self:center;background:linear-gradient(180deg,var(--ink) 30%,var(--ouro) 140%);-webkit-background-clip:text;background-clip:text;color:transparent}
.r-acoes{grid-column:1/-1;display:flex;gap:14px}
.vazio-txt{color:var(--muted);padding:32px 4px}

/* campos */
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.campo label,.lbl{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
input,select{min-height:52px;border:1px solid var(--linha);border-radius:16px;background:var(--glass-2);padding:0 14px;font-size:17px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--brasa);box-shadow:0 0 0 4px rgba(255,120,50,.16)}
input[type=date]{appearance:none;-webkit-appearance:none}

/* análise */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:6px 0 12px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--glass);border:1px solid var(--linha);border-radius:20px;padding:14px 16px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.kpi .v{display:block;font-family:var(--f-digits);font-stretch:condensed;font-weight:300;font-variant-numeric:tabular-nums;font-size:36px;line-height:1.05;background:linear-gradient(180deg,var(--ink) 35%,var(--ouro) 140%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .l{font-size:13px;color:var(--muted)}
.frase{background:var(--glass);border:1px solid var(--linha);border-radius:20px;padding:14px 16px;margin:0 0 12px}
.melhor{color:var(--ok);font-weight:700}
.pior{color:var(--paprika);font-weight:700}
.seg{display:inline-flex;padding:4px;gap:2px;border:1px solid var(--linha);border-radius:999px;background:var(--glass-2);flex-shrink:0}
.seg button{min-height:44px;min-width:56px;padding:0 16px;border:0;border-radius:999px;background:transparent;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--paprika),var(--brasa));color:#fff;box-shadow:0 6px 18px -8px var(--paprika)}
.grafico{background:var(--glass);border:1px solid var(--linha);border-radius:22px;padding:14px 12px 8px;margin:12px 0}
.grafico svg{width:100%;height:auto;display:block}
.grafico text{fill:var(--muted);font-family:var(--f-ui);font-size:12px}
.grafico .b{fill:var(--linha)}
.grafico .b.ult{fill:url(#g-vert);filter:drop-shadow(0 0 8px rgba(255,120,50,var(--brilho)))}
.grafico .med{stroke:var(--ouro);stroke-width:1.5;stroke-dasharray:5 5}
.grafico .vl{fill:var(--ink);font-weight:700}
.nota{font-size:14px;color:var(--muted)}
.bloco-nota{display:block;margin-top:6px}
.medio{color:var(--ouro);font-weight:700}
.sec{margin:26px 0 6px}
.sec h3{margin:0 0 10px;font-family:var(--f-digits);font-stretch:condensed;font-weight:500;font-size:23px;letter-spacing:.01em}
.kpis.tres{grid-template-columns:repeat(3,1fr)}
.kpis.tres .v{font-size:30px}
.bar-obj{height:10px;border-radius:99px;background:var(--linha);overflow:hidden;margin:2px 0 6px}
.bar-obj i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--paprika),var(--brasa))}
.bar-obj i.ok{background:linear-gradient(90deg,var(--ok),var(--ouro))}
.rank{list-style:none;margin:0;padding:14px 16px;background:var(--glass);border:1px solid var(--linha);border-radius:20px;display:grid;gap:14px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.rank li{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:end}
.rank .nome{font-weight:600;min-width:0}
.rank .nome small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.rank .val{font-family:var(--f-digits);font-stretch:condensed;font-weight:300;font-variant-numeric:tabular-nums;font-size:26px;line-height:1;white-space:nowrap}
.rank .val small{font-size:.5em;color:var(--muted)}
.rank .bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--linha);overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:inherit;background:var(--muted);opacity:.45}
.rank li.atual .nome{color:var(--brasa)}
.rank li.atual .bar i{opacity:1;background:linear-gradient(90deg,var(--paprika),var(--ouro));box-shadow:0 0 12px rgba(255,120,50,var(--brilho))}
.grafico .objl{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:2 4}
.grafico .objt{fill:var(--ok);font-weight:700}
.tabela{overflow-x:auto;background:var(--glass);border:1px solid var(--linha);border-radius:20px}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--linha)}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* separadores flutuantes */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:999px;background:var(--painel);border:1px solid var(--linha);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--sombra)}
.tabs button{min-height:50px;border:0;border-radius:999px;background:transparent;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{background:linear-gradient(135deg,rgba(240,84,59,.16),rgba(255,138,61,.24));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,138,61,.4)}
.tabs .cont{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:linear-gradient(135deg,var(--paprika),var(--brasa));color:#fff;font-size:12px;line-height:20px}

/* folhas */
dialog.folha{border:1px solid var(--linha);padding:0;width:min(560px,100%);max-width:100%;max-height:94vh;margin:auto auto 0;border-radius:30px 30px 0 0;background:var(--painel);color:var(--ink);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 -20px 60px -20px rgba(0,0,0,.5)}
@media (min-width:700px){dialog.folha{margin:auto;border-radius:30px}}
dialog.folha::backdrop{background:rgba(10,6,4,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.folha .corpo{padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:94vh}
.folha h2{margin:0 0 16px;font-family:var(--f-digits);font-stretch:condensed;font-weight:500;font-size:28px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:6px}
.stepper button{min-height:52px;border-radius:50%;border:1px solid var(--linha);background:var(--glass-2);font-size:22px;font-weight:600;cursor:pointer}
.stepper input{text-align:center}
.qtd{display:flex;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.chip{border:1px solid var(--linha);background:var(--glass-2);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.final{background:var(--glass-2);border:1px solid rgba(255,138,61,.35);border-radius:22px;padding:14px 18px;margin-bottom:18px;box-shadow:0 0 50px -25px rgba(255,110,40,var(--brilho))}
.final .digits{font-size:clamp(56px,16vw,96px);margin:4px 0 0}
.erro{color:var(--paprika);font-weight:600;margin:0 0 10px}
.acoes-form{display:grid;gap:10px;margin-top:8px}
.acoes-form.duas-col{grid-template-columns:1fr 1.4fr}
.bloco{border-top:1px solid var(--linha);padding-top:16px;margin-top:16px}
.bloco p{margin:0 0 12px}
.bloco .acoes{display:flex;flex-wrap:wrap;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--painel);color:var(--ink);border:1px solid rgba(255,138,61,.4);padding:13px 20px;border-radius:20px;font-weight:600;z-index:20;max-width:calc(100% - 32px);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--sombra),0 0 40px -20px rgba(255,110,40,var(--brilho))}
@media (prefers-reduced-motion: no-preference){
  dialog.folha[open]{animation:sobe .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes sobe{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="fumo" aria-hidden="true"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="g-brasa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0543B"/><stop offset=".55" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FFC872"/></linearGradient>
  <linearGradient id="g-vert" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F0543B"/><stop offset="1" stop-color="#FFC872"/></linearGradient>
</defs></svg>
<header class="topo">
  <h1>Cronómetro de produção</h1>
  <button class="txt" id="btn-dados"><span id="estado-dados">Dados</span></button>
</header>

<main>
  <section id="v-crono">
    <button class="novo" id="btn-novo">Novo cronómetro</button>
    <div id="lista-crono" class="lista"></div>
    <div class="vazio-crono" id="crono-vazio">
      <div id="mostrador-vazio"></div>
      <p>Nenhum cronómetro a contar. Toque em “Novo cronómetro” para medir uma tarefa.</p>
    </div>
  </section>

  <section id="v-registos" hidden>
    <div class="barra">
      <h2 id="n-registos">Registos</h2>
      <div class="acoes">
        <button class="btn" id="btn-excel">Exportar Excel</button>
      </div>
    </div>
    <div id="lista-registos"></div>

    <div id="analise"></div>
  </section>
</main>

<nav class="tabs" aria-label="Secções">
  <button data-v="crono" aria-current="page">Cronómetros<span class="cont" id="cont-ativos" hidden></span></button>
  <button data-v="registos">Registos</button>
  <button data-v="analise">Análise</button>
</nav>

<dialog class="folha" id="dlg-form"><div class="corpo" id="form-corpo"></div></dialog>
<dialog class="folha" id="dlg-dados"><div class="corpo" id="dados-corpo"></div></dialog>
<input type="file" id="in-json" accept=".json,application/json" hidden>

<datalist id="dl-produtos"></datalist>
<datalist id="dl-etapas"></datalist>
<datalist id="dl-lotes"></datalist>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
const FICHEIRO = 'cronometro_producao.json';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const p2 = n => String(n).padStart(2, '0');
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const num = (n, c = 1) => Number(n).toLocaleString('pt-PT', { maximumFractionDigits: c, minimumFractionDigits: 0 });
const fmtDia = ymd => ymd ? ymd.split('-').reverse().join('/') : '';
const fmtDiaLongo = ymd => new Date(ymd + 'T12:00').toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const dec = ms => Math.floor((ms % 1000) / 100);
function fmtDur(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h > 0 ? h + ':' + p2(m) + ':' + p2(s) : p2(m) + ':' + p2(s);
}
const pessoasTxt = n => n + ' ' + (Number(n) === 1 ? 'pessoa' : 'pessoas');

let S = { versao: 1, registos: [], ativos: [], apagados: [], objetivos: {} };

/* ---------- armazenamento no dispositivo (IndexedDB, com recurso a localStorage) ---------- */
const DB = {
  db: null, local: false,
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('sem IndexedDB'));
      const r = indexedDB.open('cronoProducao', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  get(k) {
    if (this.local) { try { return Promise.resolve(JSON.parse(localStorage.getItem('crono:' + k))); } catch { return Promise.resolve(null); } }
    return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  set(k, v) {
    if (this.local) { if (k !== 'pasta') localStorage.setItem('crono:' + k, JSON.stringify(v)); return Promise.resolve(); }
    return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  }
};

async function guardar() {
  S.atualizado = new Date().toISOString();
  try { await DB.set('estado', S); } catch (e) { toast('Erro a gravar no dispositivo: ' + e.message); }
  agendarPasta();
}

/* ---------- pasta .json (Chrome/Edge no PC) ---------- */
let pasta = null, pastaOk = false, tPasta = null;
const temPasta = () => 'showDirectoryPicker' in window;

function exportavel() {
  return { app: 'cronometro-producao', versao: 1, exportado: new Date().toISOString(), registos: S.registos, apagados: S.apagados, objetivos: S.objetivos };
}
function fundir(d) {
  if (!d || !Array.isArray(d.registos)) throw new Error('o ficheiro não tem registos desta app');
  const ap = new Set([...(S.apagados || []), ...(Array.isArray(d.apagados) ? d.apagados : [])]);
  const m = new Map(S.registos.map(r => [r.id, r]));
  let novos = 0;
  for (const r of d.registos) {
    if (!r || !r.id || typeof r.duracaoMs !== 'number' || ap.has(r.id)) continue;
    const loc = m.get(r.id);
    if (!loc) { m.set(r.id, r); novos++; }
    else if (r.alterado && (!loc.alterado || r.alterado > loc.alterado)) { m.set(r.id, r); novos++; }
  }
  S.apagados = [...ap];
  S.registos = [...m.values()].filter(r => !ap.has(r.id));
  if (d.objetivos && typeof d.objetivos === 'object') for (const [k, o] of Object.entries(d.objetivos)) {
    const loc = S.objetivos[k];
    if (o && (!loc || (o.alterado || '') > (loc.alterado || ''))) S.objetivos[k] = o;
  }
  return novos;
}
async function escreverPasta() {
  if (!pasta || !pastaOk) return;
  const fh = await pasta.getFileHandle(FICHEIRO, { create: true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify(exportavel(), null, 2));
  await w.close();
}
function agendarPasta() {
  if (!pasta || !pastaOk) return;
  clearTimeout(tPasta);
  tPasta = setTimeout(() => escreverPasta().catch(e => { pastaOk = false; renderEstado(); toast('Não foi possível gravar na pasta: ' + e.message); }), 500);
}
async function sincronizarPasta() {
  try {
    const fh = await pasta.getFileHandle(FICHEIRO, { create: true });
    const txt = await (await fh.getFile()).text();
    let novos = 0;
    if (txt.trim()) { novos = fundir(JSON.parse(txt)); await DB.set('estado', S); }
    await escreverPasta();
    render();
    return novos;
  } catch (e) { toast('Erro ao ler a pasta: ' + e.message); return 0; }
}
async function initPasta() {
  if (!temPasta()) return;
  try {
    pasta = await DB.get('pasta');
    if (pasta && pasta.queryPermission) {
      pastaOk = (await pasta.queryPermission({ mode: 'readwrite' })) === 'granted';
      if (pastaOk) await sincronizarPasta();
    }
  } catch { pasta = null; }
  renderEstado();
}
async function ligarPasta() {
  try {
    const h = await window.showDirectoryPicker({ id: 'cronoProducao', mode: 'readwrite' });
    pasta = h; pastaOk = true;
    await DB.set('pasta', h);
    const novos = await sincronizarPasta();
    toast('Pasta ligada: ' + h.name + (novos ? ` (${novos} registos importados do ficheiro)` : ''));
  } catch (e) { if (e.name !== 'AbortError') toast('Não foi possível ligar a pasta: ' + e.message); }
  renderEstado(); renderDados();
}
async function autorizarPasta() {
  if (!pasta) return ligarPasta();
  try {
    pastaOk = (await pasta.requestPermission({ mode: 'readwrite' })) === 'granted';
    if (pastaOk) { const novos = await sincronizarPasta(); toast('Pasta autorizada' + (novos ? ` (${novos} registos importados)` : '')); }
  } catch (e) { toast('Não foi possível autorizar: ' + e.message); }
  renderEstado(); renderDados();
}

/* ---------- partilhar / descarregar ficheiros ---------- */
const eIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function entregar(blob, nome) {
  if (eIOS() && navigator.canShare) {
    const f = new File([blob], nome, { type: blob.type });
    if (navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const carimbo = () => { const d = new Date(); return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()); };

/* ---------- cronómetros ---------- */
const decorrido = (t, ate = Date.now()) => t.acumMs + (t.inicioSeg ? ate - t.inicioSeg : 0);

function iniciar(f) {
  const agora = Date.now();
  S.ativos.push({ id: uid(), ...f, acumMs: 0, inicioSeg: agora, criado: agora, pausas: 0 });
  guardar(); render(); gerirWakeLock();
}
function pausar(t) { if (!t.inicioSeg) return; t.acumMs += Date.now() - t.inicioSeg; t.inicioSeg = null; t.pausas++; guardar(); render(); gerirWakeLock(); }
function retomar(t) { if (t.inicioSeg) return; t.inicioSeg = Date.now(); guardar(); render(); gerirWakeLock(); }

function grupoDe(r) { return norm(r.produto) + '|' + norm(r.etapa); }

function concluir(t, f, ms, fimTs) {
  const anteriores = S.registos.filter(r => grupoDe(r) === grupoDe(f));
  const reg = {
    id: t.id, produto: f.produto, etapa: f.etapa, lote: f.lote, pessoas: f.pessoas, dia: f.dia,
    quantidade: f.quantidade, unidade: f.unidade, duracaoMs: ms,
    inicio: new Date(t.criado).toISOString(), fim: new Date(fimTs).toISOString(), pausas: t.pausas
  };
  S.registos.push(reg);
  S.ativos = S.ativos.filter(x => x.id !== t.id);
  guardar(); render(); gerirWakeLock();
  let msg = 'Registo guardado: ' + fmtDur(ms);
  if (anteriores.length) {
    const media = anteriores.reduce((a, r) => a + r.duracaoMs, 0) / anteriores.length;
    const dif = (ms - media) / media * 100;
    if (Math.abs(dif) >= 1) msg += `, ${num(Math.abs(dif), 0)}% ${dif < 0 ? 'mais rápido' : 'mais lento'} que a média`;
  }
  toast(msg);
}

let wl = null;
async function gerirWakeLock() {
  const corre = S.ativos.some(t => t.inicioSeg);
  try {
    if (corre && !wl && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    } else if (!corre && wl) { await wl.release(); wl = null; }
  } catch { /* sem wake lock */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { gerirWakeLock(); tick(); } });

function tick() {
  for (const t of S.ativos) {
    if (!t.inicioSeg) continue;
    const c = document.querySelector(`.crono[data-id="${t.id}"]`);
    if (!c) continue;
    const ms = decorrido(t);
    c.querySelector('.mm').textContent = fmtDur(ms);
    c.querySelector('.dec').textContent = ',' + dec(ms);
    atualizarAnel(c, ms);
  }
}

/* ---------- render ---------- */
let vista = 'crono';
function render() {
  renderCrono(); renderRegistos(); renderAnalise(); renderListas(); renderEstado();
  const n = S.ativos.length, c = $('#cont-ativos');
  c.hidden = !n; c.textContent = n;
}
function mostrar(v) {
  vista = v;
  for (const s of ['crono', 'registos', 'analise']) $('#v-' + s).hidden = s !== v;
  document.querySelectorAll('.tabs button').forEach(b => { if (b.dataset.v === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  window.scrollTo(0, 0);
}

const R_ANEL = 92, CIRC = 2 * Math.PI * R_ANEL;
const MARCAS = Array.from({ length: 60 }, (_, i) => {
  const a = i * Math.PI / 30, m = i % 5 === 0, r1 = 84, r2 = m ? 74 : 79;
  return `<line${m ? ' class="maior"' : ''} x1="${(100 + r1 * Math.sin(a)).toFixed(2)}" y1="${(100 - r1 * Math.cos(a)).toFixed(2)}" x2="${(100 + r2 * Math.sin(a)).toFixed(2)}" y2="${(100 - r2 * Math.cos(a)).toFixed(2)}"/>`;
}).join('');
function geoAnel(ms) {
  const f = (ms % 60000) / 60000, a = f * 2 * Math.PI;
  return { off: (CIRC * (1 - f)).toFixed(1), x: (100 + R_ANEL * Math.sin(a)).toFixed(1), y: (100 - R_ANEL * Math.cos(a)).toFixed(1) };
}
function mostrador(ms) {
  const g = geoAnel(ms);
  return `<div class="mostrador"><svg class="anel" viewBox="0 0 200 200" aria-hidden="true"><circle class="disco" cx="100" cy="100" r="70"/><g class="marcas">${MARCAS}</g><circle class="pista" cx="100" cy="100" r="${R_ANEL}"/><circle class="arco" cx="100" cy="100" r="${R_ANEL}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${g.off}" transform="rotate(-90 100 100)"/><circle class="ponta" cx="${g.x}" cy="${g.y}" r="4.5"/></svg><div class="digits${ms >= 3600000 ? ' longo' : ''}"><span class="mm">${fmtDur(ms)}</span><span class="dec">,${dec(ms)}</span></div></div>`;
}
function atualizarAnel(c, ms) {
  const g = geoAnel(ms), p = c.querySelector('.ponta');
  c.querySelector('.arco').setAttribute('stroke-dashoffset', g.off);
  p.setAttribute('cx', g.x); p.setAttribute('cy', g.y);
  c.querySelector('.digits').classList.toggle('longo', ms >= 3600000);
}

function renderCrono() {
  const el = $('#lista-crono'), n = S.ativos.length;
  if (!$('#mostrador-vazio').innerHTML) $('#mostrador-vazio').innerHTML = mostrador(0);
  el.className = 'lista' + (n > 1 ? ' varios' : '');
  $('#crono-vazio').hidden = n > 0;
  el.innerHTML = S.ativos.map(t => {
    const corre = !!t.inicioSeg, ms = decorrido(t);
    return `<article class="crono ${corre ? 'corre' : 'pausa'}" data-id="${t.id}">
      <div class="cab"><div><h2>${esc(t.produto)}</h2><p class="etapa">${esc(t.etapa)}</p></div>
        <button class="txt" data-acao="editar">Editar</button></div>
      ${mostrador(ms)}
      <p class="estado">${corre ? 'A contar' : 'Em pausa'}</p>
      <ul class="meta">${t.lote ? `<li>Lote ${esc(t.lote)}</li>` : ''}<li>${pessoasTxt(t.pessoas)}</li><li>${fmtDia(t.dia)}</li>${t.quantidade ? `<li>${num(t.quantidade, 2)} ${t.unidade}</li>` : ''}</ul>
      <div class="acoes">
        <button class="btn" data-acao="${corre ? 'pausar' : 'retomar'}">${corre ? 'Pausar' : 'Retomar'}</button>
        <button class="btn pri" data-acao="parar">Parar e guardar</button>
      </div></article>`;
  }).join('');
}

function renderRegistos() {
  const regs = [...S.registos].sort((a, b) => b.fim.localeCompare(a.fim));
  $('#n-registos').textContent = regs.length ? `${regs.length} ${regs.length === 1 ? 'registo' : 'registos'}` : 'Registos';
  $('#btn-excel').disabled = !regs.length;
  const el = $('#lista-registos');
  if (!regs.length) { el.innerHTML = '<p class="vazio-txt">Ainda não há registos. Quando parar um cronómetro e guardar, a contagem aparece aqui.</p>'; return; }
  const dias = [...new Set(regs.map(r => r.dia))].sort().reverse();
  el.innerHTML = dias.map(d => `<h3 class="dia">${esc(fmtDiaLongo(d))}</h3><ul class="regs">${regs.filter(r => r.dia === d).map(r => {
    const meta = [r.lote ? 'Lote ' + esc(r.lote) : '', pessoasTxt(r.pessoas), r.quantidade ? num(r.quantidade, 2) + ' ' + r.unidade : 'sem quantidade', r.alterado ? 'editado' : ''].filter(Boolean).join(', ');
    return `<li data-id="${r.id}"><div class="r-info"><strong>${esc(r.produto)}</strong><span>${esc(r.etapa)}</span><span>${meta}</span></div>
      <div class="r-tempo">${fmtDur(r.duracaoMs)}</div>
      <div class="r-acoes"><button class="txt" data-acao="editar">Editar</button><button class="txt" data-acao="repetir">Medir de novo</button><button class="txt" data-acao="apagar">Apagar</button></div></li>`;
  }).join('')}</ul>`).join('');
}

function renderListas() {
  const fontes = [...S.registos].sort((a, b) => b.fim.localeCompare(a.fim)).concat(S.ativos);
  const unicos = campo => { const m = new Map(); for (const r of fontes) { const k = norm(r[campo]); if (k && !m.has(k)) m.set(k, r[campo].trim()); } return [...m.values()]; };
  $('#dl-produtos').innerHTML = unicos('produto').map(v => `<option value="${esc(v)}">`).join('');
  $('#dl-etapas').innerHTML = unicos('etapa').map(v => `<option value="${esc(v)}">`).join('');
}

function renderEstado() {
  let t = 'Dados';
  if (temPasta() && pasta) t = pastaOk ? 'Pasta: ' + pasta.name : 'Autorizar pasta';
  $('#estado-dados').textContent = t;
}

/* ---------- análise ---------- */
let grupoSel = null, metrica = 'tempo';
function grupos() {
  const m = new Map();
  for (const r of S.registos) {
    const k = grupoDe(r);
    if (!m.has(k)) m.set(k, { k, regs: [] });
    m.get(k).regs.push(r);
  }
  for (const g of m.values()) {
    g.regs.sort((a, b) => a.fim.localeCompare(b.fim));
    const u = g.regs[g.regs.length - 1]; g.produto = u.produto; g.etapa = u.etapa;
  }
  return [...m.values()].sort((a, b) => b.regs.length - a.regs.length || a.produto.localeCompare(b.produto));
}
function taxa(r) {
  if (!(r.quantidade > 0) || !(r.duracaoMs > 0)) return null;
  const h = r.duracaoMs / 3600000;
  return { u: r.unidade || 'kg', hora: r.quantidade / h, pessoaHora: r.quantidade / h / Math.max(1, r.pessoas || 1) };
}
const media = a => a.reduce((x, y) => x + y, 0) / a.length;
const desvio = a => { const m = media(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
function unidadePrincipal(regs) {
  const c = {}; for (const r of regs) { const t = taxa(r); if (t) c[t.u] = (c[t.u] || 0) + 1; }
  return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || null;
}

function grafico(vals, rotulos, fmt, objV) {
  const W = 640, H = 230, pl = 6, pr = 6, pt = 26, pb = 26, n = vals.length;
  const max = Math.max(...vals, objV || 0) * 1.12 || 1, med = media(vals);
  const bw = (W - pl - pr) / n, barW = Math.max(3, Math.min(46, bw * 0.66));
  const y = v => H - pb - (v / max) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução das contagens, a última destacada">`;
  vals.forEach((v, i) => {
    const x = pl + i * bw + (bw - barW) / 2;
    s += `<rect class="b${i === n - 1 ? ' ult' : ''}" x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${barW.toFixed(1)}" height="${(H - pb - y(v)).toFixed(1)}" rx="6"/>`;
    if (n <= 14) s += `<text x="${(x + barW / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(rotulos[i])}</text>`;
  });
  const ym = y(med);
  s += `<line class="med" x1="${pl}" x2="${W - pr}" y1="${ym.toFixed(1)}" y2="${ym.toFixed(1)}"/>`;
  s += `<text x="${pl + 2}" y="${(ym - 6).toFixed(1)}">média ${esc(fmt(med))}</text>`;
  if (objV) { const yo = y(objV); s += `<line class="objl" x1="${pl}" x2="${W - pr}" y1="${yo.toFixed(1)}" y2="${yo.toFixed(1)}"/><text class="objt" x="${W - pr - 2}" y="${(yo - 6).toFixed(1)}" text-anchor="end">objetivo ${esc(fmt(objV))}</text>`; }
  const xl = pl + (n - 1) * bw + bw / 2, vl = vals[n - 1];
  s += `<text class="vl" x="${Math.min(W - 30, Math.max(30, xl)).toFixed(1)}" y="${(y(vl) - 6).toFixed(1)}" text-anchor="middle">${esc(fmt(vl))}</text>`;
  return s + '</svg>';
}

function renderAnalise() {
  const el = $('#analise'), gs = grupos();
  if (!gs.length) { el.innerHTML = '<p class="vazio-txt">Ainda não há registos para analisar. Pare e guarde um cronómetro para criar o primeiro.</p>'; return; }
  if (!gs.some(g => g.k === grupoSel)) grupoSel = gs[0].k;
  const g = gs.find(x => x.k === grupoSel), regs = g.regs, n = regs.length;
  const dur = regs.map(r => r.duracaoMs);
  const ult = regs[n - 1];
  let html = `<div class="campo"><label for="sel-grupo">Produto e etapa</label><select id="sel-grupo">${gs.map(x => `<option value="${esc(x.k)}"${x.k === grupoSel ? ' selected' : ''}>${esc(x.produto)} / ${esc(x.etapa)} (${x.regs.length})</option>`).join('')}</select></div>`;

  html += `<div class="kpis">
    <div class="kpi"><span class="v">${n}</span><span class="l">${n === 1 ? 'contagem' : 'contagens'}</span></div>
    <div class="kpi"><span class="v">${fmtDur(media(dur))}</span><span class="l">tempo médio</span></div>
    <div class="kpi"><span class="v">${fmtDur(Math.min(...dur))}</span><span class="l">mais rápida</span></div>
    <div class="kpi"><span class="v">${fmtDur(Math.max(...dur))}</span><span class="l">mais lenta</span></div></div>`;

  if (n >= 2) {
    const mAnt = media(dur.slice(0, -1)), dif = (ult.duracaoMs - mAnt) / mAnt * 100;
    html += `<p class="frase">Última contagem (${fmtDia(ult.dia)}): <strong>${fmtDur(ult.duracaoMs)}</strong>, ` +
      (Math.abs(dif) < 1 ? 'igual à média das anteriores.' :
        `<span class="${dif < 0 ? 'melhor' : 'pior'}">${num(Math.abs(dif), 0)}% ${dif < 0 ? 'mais rápida' : 'mais lenta'}</span> que a média das anteriores (${fmtDur(mAnt)}).`) + '</p>';
  }

  // produtividade por unidade
  const porU = {};
  for (const r of regs) { const t = taxa(r); if (t) (porU[t.u] = porU[t.u] || []).push({ r, t }); }
  const unidades = Object.keys(porU);
  for (const u of unidades) {
    const l = porU[u], ph = l.map(x => x.t.hora), pp = l.map(x => x.t.pessoaHora);
    const ultT = taxa(ult);
    html += `<div class="kpis">
      <div class="kpi"><span class="v">${num(media(ph))}</span><span class="l">${u}/hora (média)</span></div>
      <div class="kpi"><span class="v">${num(media(pp))}</span><span class="l">${u}/pessoa/hora (média)</span></div>
      <div class="kpi"><span class="v">${num(Math.max(...pp))}</span><span class="l">melhor ${u}/pessoa/hora</span></div>
      <div class="kpi"><span class="v">${ultT && ultT.u === u ? num(ultT.pessoaHora) : '—'}</span><span class="l">última ${u}/pessoa/hora</span></div></div>`;
  }
  const semQ = regs.filter(r => !taxa(r)).length;
  if (!unidades.length) html += `<p class="nota">Sem quantidades registadas neste grupo: a comparação é só de tempo, e lotes de tamanho diferente não são comparáveis entre si. Objetivo, estimativa e comparações precisam da quantidade.</p>`;
  else if (semQ) html += `<p class="nota">${semQ} de ${n} contagens sem quantidade ficam fora das médias de produtividade.</p>`;

  const u0 = unidadePrincipal(regs);
  const comT = u0 ? regs.map(r => ({ r, t: taxa(r) })).filter(x => x.t && x.t.u === u0) : [];
  const ppAll = comT.map(x => x.t.pessoaHora);
  const ob = S.objetivos[g.k], objV = ob && ob.unidade === u0 ? ob.valor : null;

  // objetivo
  if (u0) {
    html += `<section class="sec"><h3>Objetivo</h3><div class="campo"><label for="in-obj">Meta em ${u0}/pessoa/hora (vazio para remover)</label><div class="qtd"><input id="in-obj" inputmode="decimal" autocomplete="off" placeholder="ex.: 40" value="${objV ? esc(String(objV).replace('.', ',')) : ''}"><button type="button" class="btn" data-a="obj" data-u="${u0}">Guardar</button></div></div>`;
    if (objV) {
      const pm = media(ppAll) / objV * 100, pu = ppAll[ppAll.length - 1] / objV * 100, at = ppAll.filter(v => v >= objV).length;
      html += `<div class="kpis tres"><div class="kpi"><span class="v">${num(pm, 0)}%</span><span class="l">média do objetivo</span></div><div class="kpi"><span class="v">${num(pu, 0)}%</span><span class="l">última contagem</span></div><div class="kpi"><span class="v">${at}/${ppAll.length}</span><span class="l">no objetivo</span></div></div><div class="bar-obj" role="img" aria-label="Média a ${num(pm, 0)}% do objetivo"><i class="${pm >= 100 ? 'ok' : ''}" style="width:${Math.min(100, pm).toFixed(1)}%"></i></div>`;
    } else html += '<p class="nota">Defina uma meta para ver o atingimento de cada contagem.</p>';
    html += '</section>';
  }

  // consistência
  if (n >= 2) {
    const usaT = ppAll.length >= 2, vals = usaT ? ppAll : dur, cv = desvio(vals) / media(vals) * 100;
    const [txt, cls] = cv < 10 ? ['Muito consistente', 'melhor'] : cv < 20 ? ['Consistente', 'melhor'] : cv < 35 ? ['Variável', 'medio'] : ['Muito variável', 'pior'];
    const fmtV = usaT ? v => num(v) + ' ' + u0 + '/pessoa/hora' : fmtDur;
    html += `<section class="sec"><h3>Consistência</h3><p class="frase"><span class="${cls}">${txt}</span>: variação típica de ±${num(cv, 0)}% em ${usaT ? u0 + '/pessoa/hora' : 'tempo'}, entre ${fmtV(Math.min(...vals))} e ${fmtV(Math.max(...vals))}.${vals.length < 4 ? ' Com tão poucas contagens, este indicador ainda é pouco fiável.' : ''}</p></section>`;
  }

  // tempo-padrão e estimativa
  if (comT.length) {
    ctxEst = { comT, u0, objV };
    if (estPes == null) estPes = String(ult.pessoas || 1);
    html += `<section class="sec"><h3>Tempo-padrão e estimativa</h3>
      <p class="frase">Tempo-padrão: <strong>${fmtDur(100 / media(ppAll) * 3600000)}</strong> de trabalho de 1 pessoa por cada 100 ${u0}.</p>
      <div class="duas"><div class="campo"><label for="est-qtd">Quantidade a produzir (${u0})</label><input id="est-qtd" inputmode="decimal" autocomplete="off" placeholder="ex.: 300" value="${esc(estQtd)}"></div>
      <div class="campo"><label for="est-pes">Pessoas</label><input id="est-pes" inputmode="numeric" autocomplete="off" value="${esc(estPes)}"></div></div>
      <div class="frase" id="est-res">${calcEstimativa()}</div></section>`;
  } else ctxEst = null;

  // por tamanho da equipa
  if (comT.length) {
    const por = {}; for (const x of comT) (por[x.r.pessoas] = por[x.r.pessoas] || []).push(x.t);
    const ks = Object.keys(por).map(Number).sort((a, b) => a - b);
    const lin = ks.map(k => ({ k, n: por[k].length, pp: media(por[k].map(t => t.pessoaHora)), h: media(por[k].map(t => t.hora)) }));
    const mx = Math.max(...lin.map(l => l.pp));
    html += `<section class="sec"><h3>Por tamanho da equipa</h3><ul class="rank">${lin.map(l => `<li class="${lin.length > 1 && l.pp === mx ? 'atual' : ''}"><span class="nome">${pessoasTxt(l.k)}<small>${l.n} ${l.n === 1 ? 'contagem' : 'contagens'}, ${num(l.h)} ${u0}/hora em equipa</small></span><span class="val">${num(l.pp)}<small> ${u0}/pessoa/h</small></span><span class="bar"><i style="width:${(l.pp / mx * 100).toFixed(1)}%"></i></span></li>`).join('')}</ul>${lin.length < 2 ? `<p class="nota">Todas as contagens foram feitas com ${pessoasTxt(ks[0])}. Meça com equipas de tamanho diferente para comparar.</p>` : ''}</section>`;
  }

  // produtos na mesma etapa
  if (u0) {
    const mesmaEtapa = gs.filter(x => norm(x.etapa) === norm(g.etapa)).map(x => {
      const ts = x.regs.map(taxa).filter(t => t && t.u === u0), o = S.objetivos[x.k];
      return { x, n: ts.length, pp: ts.length ? media(ts.map(t => t.pessoaHora)) : 0, o: o && o.unidade === u0 ? o.valor : null };
    }).filter(l => l.n).sort((a, b) => b.pp - a.pp);
    const mx = Math.max(...mesmaEtapa.map(l => l.pp));
    html += `<section class="sec"><h3>Produtos na etapa ${esc(g.etapa)}</h3>` + (mesmaEtapa.length < 2
      ? `<p class="nota">Ainda só há este produto medido nesta etapa com quantidade em ${u0}.</p>`
      : `<ul class="rank">${mesmaEtapa.map((l, i) => `<li class="${l.x.k === g.k ? 'atual' : ''}"><span class="nome">${i + 1}. ${esc(l.x.produto)}<small>${l.n} ${l.n === 1 ? 'contagem' : 'contagens'}${l.o ? `, ${num(l.pp / l.o * 100, 0)}% do objetivo` : ''}</small></span><span class="val">${num(l.pp)}<small> ${u0}/pessoa/h</small></span><span class="bar"><i style="width:${(l.pp / mx * 100).toFixed(1)}%"></i></span></li>`).join('')}</ul>`) + '</section>';
  }

  // evolução
  if (n >= 2) {
    const opcoes = [['tempo', 'Tempo']].concat(unidades.map(u => ['pp-' + u, u + '/pessoa/hora']));
    if (!opcoes.some(o => o[0] === metrica)) metrica = 'tempo';
    html += `<section class="sec"><h3>Evolução</h3><div class="seg" role="group" aria-label="Métrica do gráfico" id="seg-metrica">${opcoes.map(o => `<button type="button" data-m="${o[0]}" aria-pressed="${o[0] === metrica}">${esc(o[1])}</button>`).join('')}</div>`;
    let vals, rot, fmt, linhaObj = null;
    if (metrica === 'tempo') { vals = regs.map(r => r.duracaoMs); rot = regs.map(r => fmtDia(r.dia).slice(0, 5)); fmt = fmtDur; }
    else { const u = metrica.slice(3); const l = porU[u]; vals = l.map(x => x.t.pessoaHora); rot = l.map(x => fmtDia(x.r.dia).slice(0, 5)); fmt = v => num(v); if (u === u0) linhaObj = objV; }
    if (vals.length >= 2) html += `<div class="grafico">${grafico(vals, rot, fmt, linhaObj)}</div>`;
    html += '</section>';
  }

  html += `<section class="sec"><h3>Contagens</h3><div class="tabela"><table><thead><tr><th>Dia</th><th>Lote</th><th class="n">Pessoas</th><th class="n">Quantidade</th><th class="n">Tempo</th><th class="n">por pessoa/hora</th>${objV ? '<th class="n">% objetivo</th>' : ''}</tr></thead><tbody>` +
    [...regs].reverse().map(r => { const t = taxa(r); return `<tr><td>${fmtDia(r.dia)}</td><td>${esc(r.lote || '')}</td><td class="n">${r.pessoas}</td><td class="n">${r.quantidade ? num(r.quantidade, 2) + ' ' + r.unidade : ''}</td><td class="n">${fmtDur(r.duracaoMs)}</td><td class="n">${t ? num(t.pessoaHora) + ' ' + t.u : ''}</td>${objV ? `<td class="n">${t && t.u === u0 ? `<span class="${t.pessoaHora >= objV ? 'melhor' : 'pior'}">${num(t.pessoaHora / objV * 100, 0)}%</span>` : ''}</td>` : ''}</tr>`; }).join('') +
    `</tbody></table></div></section>`;
  el.innerHTML = html;
}

let ctxEst = null, estQtd = '', estPes = null;
function calcEstimativa() {
  const c = ctxEst; if (!c) return '';
  const q = parseFloat(String(estQtd).replace(/\s/g, '').replace(',', '.')), p = parseInt(estPes, 10);
  if (!(q > 0) || !(p >= 1)) return 'Indique a quantidade e o número de pessoas para estimar o tempo.';
  const mesma = c.comT.filter(x => Number(x.r.pessoas) === p);
  const pp = (mesma.length ? mesma : c.comT).map(x => x.t.pessoaHora);
  const h = r => fmtDur(q / (r * p) * 3600000);
  let t = `Para ${num(q, 2)} ${c.u0} com ${pessoasTxt(p)}: <strong>${h(media(pp))}</strong>`;
  if (pp.length >= 2) t += ` (entre ${h(Math.max(...pp))} e ${h(Math.min(...pp))})`;
  t += '.';
  if (c.objV) t += ` Ao ritmo do objetivo: <strong>${h(c.objV)}</strong>.`;
  t += `<span class="nota bloco-nota">${mesma.length ? (mesma.length === 1 ? `Com base na única contagem feita com ${pessoasTxt(p)}.` : `Com base nas ${mesma.length} contagens feitas com ${pessoasTxt(p)}.`) : `Não há contagens com ${pessoasTxt(p)}: usei a média de todas, assumindo que o rendimento por pessoa se mantém.`}</span>`;
  return t;
}

/* ---------- formulário (novo / editar / parar) ---------- */
let ctxForm = null;
function recentes() {
  const vistos = new Set(), out = [];
  for (const r of [...S.registos].sort((a, b) => b.fim.localeCompare(a.fim))) {
    const k = grupoDe(r); if (vistos.has(k)) continue; vistos.add(k); out.push(r); if (out.length >= 6) break;
  }
  return out;
}
function abrirForm(modo, d = {}, extra = {}) {
  ctxForm = { modo, ...extra };
  const titulo = { novo: 'Novo cronómetro', editar: 'Editar cronómetro', parar: 'Parar e guardar', registo: 'Editar registo' }[modo];
  let topo = '';
  if (modo === 'parar') topo = `<div class="final"><span class="lbl">Tempo medido</span><div class="digits">${fmtDur(extra.ms)}<span class="dec">,${dec(extra.ms)}</span></div></div>`;
  if (modo === 'registo') { ctxForm.durOrig = d.duracaoMs; topo = `<div class="campo"><label for="f-dur">Tempo medido (mm:ss ou h:mm:ss)</label><input id="f-dur" inputmode="numbers-and-punctuation" autocomplete="off" value="${fmtDur(d.duracaoMs)}"></div>`; }
  if (modo === 'novo') { const rec = recentes(); ctxForm.rec = rec; if (rec.length) topo = `<span class="lbl">Recentes</span><div class="chips">${rec.map((r, i) => `<button type="button" class="chip" data-i="${i}">${esc(r.produto)} / ${esc(r.etapa)}</button>`).join('')}</div>`; }
  const un = d.unidade || 'kg';
  let botoes;
  if (modo === 'novo') botoes = `<div class="acoes-form duas-col"><button type="button" class="btn" data-f="fechar">Cancelar</button><button type="button" class="btn pri" data-f="ok">Iniciar</button></div>`;
  else if (modo === 'editar' || modo === 'registo') botoes = `<div class="acoes-form duas-col"><button type="button" class="btn" data-f="fechar">Cancelar</button><button type="button" class="btn pri" data-f="ok">Guardar alterações</button></div>`;
  else botoes = `<div class="acoes-form"><button type="button" class="btn pri largo" data-f="ok">Guardar registo</button><div class="acoes-form duas-col"><button type="button" class="btn" data-f="fechar">Continuar a contar</button><button type="button" class="btn perigo" data-f="descartar">Descartar contagem</button></div></div>`;

  $('#form-corpo').innerHTML = `<h2>${titulo}</h2>${topo}
    <div class="campo"><label for="f-produto">Produto</label><input id="f-produto" list="dl-produtos" autocomplete="off" value="${esc(d.produto || '')}"></div>
    <div class="campo"><label for="f-etapa">Etapa do processo</label><input id="f-etapa" list="dl-etapas" autocomplete="off" value="${esc(d.etapa || '')}"></div>
    <div class="campo"><label for="f-lote">Lote</label><input id="f-lote" autocomplete="off" value="${esc(d.lote || '')}"></div>
    <div class="duas">
      <div class="campo"><label for="f-pessoas">Pessoas</label><div class="stepper"><button type="button" data-step="-1" aria-label="Menos uma pessoa">−</button><input id="f-pessoas" inputmode="numeric" value="${esc(d.pessoas || 1)}"><button type="button" data-step="1" aria-label="Mais uma pessoa">+</button></div></div>
      <div class="campo"><label for="f-dia">Dia</label><input id="f-dia" type="date" value="${esc(d.dia || hoje())}"></div>
    </div>
    <div class="campo"><label for="f-qtd">Quantidade produzida${modo === 'novo' || modo === 'editar' ? ' (pode ficar para o fim)' : ''}</label>
      <div class="qtd"><input id="f-qtd" inputmode="decimal" autocomplete="off" value="${d.quantidade != null && d.quantidade !== '' ? esc(String(d.quantidade).replace('.', ',')) : ''}">
      <div class="seg" role="group" aria-label="Unidade"><button type="button" data-un="kg" aria-pressed="${un === 'kg'}">kg</button><button type="button" data-un="un" aria-pressed="${un === 'un'}">un</button></div></div></div>
    <p class="erro" id="f-erro" hidden></p>${botoes}`;
  const dlg = $('#dlg-form');
  if (!dlg.open) dlg.showModal();
  if (modo === 'novo' && !d.produto) $('#f-produto').focus({ preventScroll: true });
}
function lerForm() {
  const v = id => $('#' + id).value.trim();
  const erro = m => { const e = $('#f-erro'); e.textContent = m; e.hidden = false; return null; };
  const produto = v('f-produto'), etapa = v('f-etapa');
  if (!produto) return erro('Indique o produto.');
  if (!etapa) return erro('Indique a etapa do processo.');
  const pessoas = parseInt(v('f-pessoas'), 10);
  if (!(pessoas >= 1)) return erro('O número de pessoas tem de ser 1 ou mais.');
  const dia = v('f-dia');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dia)) return erro('Indique o dia.');
  const qt = v('f-qtd').replace(/\s/g, '').replace(',', '.');
  let quantidade = null;
  if (qt) { quantidade = parseFloat(qt); if (!(quantidade > 0)) return erro('A quantidade tem de ser um número maior que zero.'); }
  const unidade = $('#form-corpo .seg button[aria-pressed="true"]').dataset.un;
  const out = { produto, etapa, lote: v('f-lote'), pessoas, dia, quantidade, unidade };
  if ($('#f-dur')) {
    const txt = v('f-dur');
    if (txt === fmtDur(ctxForm.durOrig)) out.duracaoMs = ctxForm.durOrig;
    else {
      const pt = txt.split(':').map(x => x.trim());
      if (pt.length < 2 || pt.length > 3 || pt.some(x => !/^\d+$/.test(x))) return erro('Escreva o tempo como mm:ss ou h:mm:ss (ex.: 12:30 ou 1:05:00).');
      const [h, m, sg] = pt.length === 3 ? pt.map(Number) : [0, ...pt.map(Number)];
      if (sg > 59 || (pt.length === 3 && m > 59)) return erro('Minutos e segundos vão de 0 a 59.');
      out.duracaoMs = ((h * 60 + m) * 60 + sg) * 1000;
      if (!(out.duracaoMs > 0)) return erro('O tempo tem de ser maior que zero.');
    }
  }
  return out;
}
$('#form-corpo').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.step) { const i = $('#f-pessoas'); i.value = Math.max(1, (parseInt(i.value, 10) || 1) + Number(b.dataset.step)); return; }
  if (b.dataset.un) { b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (b.classList.contains('chip')) {
    const r = ctxForm.rec[b.dataset.i];
    $('#f-produto').value = r.produto; $('#f-etapa').value = r.etapa; $('#f-pessoas').value = r.pessoas;
    $('#form-corpo .seg button[data-un="' + (r.unidade || 'kg') + '"]').click();
    $('#f-lote').focus(); return;
  }
  const dlg = $('#dlg-form');
  if (b.dataset.f === 'fechar') { dlg.close(); return; }
  if (b.dataset.f === 'descartar') {
    if (!confirm('Descartar esta contagem? O tempo medido não fica guardado.')) return;
    S.ativos = S.ativos.filter(x => x.id !== ctxForm.id); guardar(); render(); gerirWakeLock(); dlg.close(); toast('Contagem descartada'); return;
  }
  if (b.dataset.f === 'ok') {
    const f = lerForm(); if (!f) return;
    if (ctxForm.modo === 'novo') { iniciar(f); mostrar('crono'); }
    else if (ctxForm.modo === 'registo') {
      const r = S.registos.find(x => x.id === ctxForm.id);
      if (!r) { dlg.close(); toast('Este registo já não existe.'); return; }
      Object.assign(r, f, { alterado: new Date().toISOString() });
      guardar(); render(); toast('Registo atualizado');
    }
    else {
      const t = S.ativos.find(x => x.id === ctxForm.id);
      if (!t) { dlg.close(); toast('Este cronómetro já não existe.'); return; }
      if (ctxForm.modo === 'editar') { Object.assign(t, f); guardar(); render(); }
      else concluir(t, f, ctxForm.ms, ctxForm.fimTs);
    }
    dlg.close();
  }
});
$('#form-corpo').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); $('#form-corpo [data-f="ok"]').click(); } });

}

$('#dados-corpo').addEventListener('click', async e => {

$('#in-json').addEventListener('change', async e => {

// XLSX-INICIO
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipar(fs) {
  const enc = new TextEncoder(), partes = [], central = []; let off = 0;
  const d = new Date();
  const dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  for (const f of fs) {
    const nome = enc.encode(f.nome), dados = enc.encode(f.dados), crc = crc32(dados);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true);
    h.setUint32(18, dados.length, true); h.setUint32(22, dados.length, true); h.setUint16(26, nome.length, true); h.setUint16(28, 0, true);
    partes.push(new Uint8Array(h.buffer), nome, dados);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true);
    c.setUint32(20, dados.length, true); c.setUint32(24, dados.length, true); c.setUint16(28, nome.length, true);
    c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nome);
    off += 30 + nome.length + dados.length;
  }
  const tamC = central.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, fs.length, true); e.setUint16(10, fs.length, true);
  e.setUint32(12, tamC, true); e.setUint32(16, off, true);
  return new Blob([...partes, ...central, new Uint8Array(e.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
const xEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
function colL(i) { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
const ST = { cab: 1, data: 2, dur: 3, n2: 4, dh: 5, n1: 6 };
function folhaXml(linhas, larg) {
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>' +
    larg.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols><sheetData>';
  linhas.forEach((l, ri) => {
    x += `<row r="${ri + 1}">`;
    l.forEach((c, ci) => {
      if (c == null) return;
      const cel = typeof c === 'object' ? c : { v: c };
      if (cel.v == null || cel.v === '') return;
      const ref = colL(ci) + (ri + 1), st = cel.s ? ` s="${cel.s}"` : '';
      if (typeof cel.v === 'number' && isFinite(cel.v)) x += `<c r="${ref}"${st}><v>${cel.v}</v></c>`;
      else x += `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xEsc(cel.v)}</t></is></c>`;
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}
function livroXlsx(folhas) {
  const ns = 'http://schemas.openxmlformats.org/';
  const fs = [
    { nome: '[Content_Types].xml', dados: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${ns}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>` + folhas.map((f, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>' },
    { nome: '_rels/.rels', dados: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships"><Relationship Id="rId1" Type="${ns}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { nome: 'xl/workbook.xml', dados: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${ns}spreadsheetml/2006/main" xmlns:r="${ns}officeDocument/2006/relationships"><sheets>` + folhas.map((f, i) => `<sheet name="${xEsc(f.nome)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>' },
    { nome: 'xl/_rels/workbook.xml.rels', dados: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships">` + folhas.map((f, i) => `<Relationship Id="rId${i + 1}" Type="${ns}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + `<Relationship Id="rId${folhas.length + 1}" Type="${ns}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { nome: 'xl/styles.xml', dados: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}spreadsheetml/2006/main"><numFmts count="3"><numFmt numFmtId="164" formatCode="[h]:mm:ss"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/><numFmt numFmtId="166" formatCode="dd/mm/yyyy hh:mm"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE9ECE8"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="2" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` }
  ];

}
const serialDia = ymd => { const [y, m, d] = ymd.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000 + 25569; };
const serialDH = iso => { const d = new Date(iso); return (d.getTime() - d.getTimezoneOffset() * 60000) / 86400000 + 25569; };
const r2 = v => Math.round(v * 100) / 100;
function construirExcel(registos) {
  const cab = a => a.map(v => ({ v, s: ST.cab }));
  const regs = [...registos].sort((a, b) => a.fim.localeCompare(b.fim));
  const L1 = [cab(['Dia', 'Produto', 'Etapa', 'Lote', 'Pessoas', 'Quantidade', 'Unidade', 'Duração', 'Minutos', 'Qtd/hora', 'Qtd/pessoa/hora', 'Início', 'Fim', 'Pausas', 'Editado em'])];
  for (const r of regs) {
    const t = taxa(r);
    L1.push([{ v: serialDia(r.dia), s: ST.data }, r.produto, r.etapa, r.lote || '', r.pessoas, r.quantidade != null ? { v: r.quantidade, s: ST.n2 } : '', r.quantidade != null ? r.unidade : '',
      { v: r.duracaoMs / 86400000, s: ST.dur }, { v: r2(r.duracaoMs / 60000), s: ST.n2 },
      t ? { v: r2(t.hora), s: ST.n2 } : '', t ? { v: r2(t.pessoaHora), s: ST.n2 } : '',
      { v: serialDH(r.inicio), s: ST.dh }, { v: serialDH(r.fim), s: ST.dh }, r.pausas || 0, r.alterado ? { v: serialDH(r.alterado), s: ST.dh } : '']);
  }
  const m = new Map();
  for (const r of regs) { const k = grupoDe(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  const L2 = [cab(['Produto', 'Etapa', 'Contagens', 'Tempo médio', 'Mais rápida', 'Mais lenta', 'Unidade', 'Contagens com quantidade', 'Média Qtd/hora', 'Média Qtd/pessoa/hora', 'Melhor Qtd/pessoa/hora', 'Objetivo Qtd/pessoa/hora', '% do objetivo (média)', 'Variação CV %', 'Tempo-padrão por 100 (1 pessoa)'])];
  for (const l of m.values()) {
    const u = l[l.length - 1], d = l.map(r => r.duracaoMs);
    const base = [u.produto, u.etapa, l.length, { v: media(d) / 86400000, s: ST.dur }, { v: Math.min(...d) / 86400000, s: ST.dur }, { v: Math.max(...d) / 86400000, s: ST.dur }];
    const porU = {};
    for (const r of l) { const t = taxa(r); if (t) (porU[t.u] = porU[t.u] || []).push(t); }
    const us = Object.keys(porU);
    if (!us.length) L2.push(base);
    us.forEach(un => {
      const ts = porU[un], pp = ts.map(t => t.pessoaHora), mp = media(pp), o = S.objetivos[grupoDe(u)], ov = o && o.unidade === un ? o.valor : null;
      L2.push([...base, un, ts.length, { v: r2(media(ts.map(t => t.hora))), s: ST.n2 }, { v: r2(mp), s: ST.n2 }, { v: r2(Math.max(...pp)), s: ST.n2 },
        ov ? { v: ov, s: ST.n2 } : '', ov ? { v: r2(mp / ov * 100), s: ST.n2 } : '', pp.length >= 2 ? { v: r2(desvio(pp) / mp * 100), s: ST.n2 } : '', { v: 100 / mp / 24, s: ST.dur }]);
    });
  }
  const L3 = [cab(['Produto', 'Etapa', 'Pessoas', 'Unidade', 'Contagens', 'Média Qtd/hora', 'Média Qtd/pessoa/hora'])];
  for (const l of m.values()) {
    const u = l[l.length - 1], por = {};
    for (const r of l) { const t = taxa(r); if (t) { const k = t.u + '|' + r.pessoas; (por[k] = por[k] || []).push(t); } }
    Object.keys(por).sort((a, b) => a.split('|')[0].localeCompare(b.split('|')[0]) || Number(a.split('|')[1]) - Number(b.split('|')[1])).forEach(k => {
      const [un, pe] = k.split('|'), ts = por[k];
      L3.push([u.produto, u.etapa, Number(pe), un, ts.length, { v: r2(media(ts.map(t => t.hora))), s: ST.n2 }, { v: r2(media(ts.map(t => t.pessoaHora))), s: ST.n2 }]);
    });
  }
  return livroXlsx([
    { nome: 'Registos', linhas: L1, larg: [11, 24, 22, 14, 9, 11, 8, 10, 9, 10, 15, 16, 16, 8, 16] },
    { nome: 'Resumo', linhas: L2, larg: [24, 22, 10, 12, 12, 12, 8, 14, 14, 18, 18, 18, 16, 12, 18] },
    { nome: 'Por equipa', linhas: L3, larg: [24, 22, 9, 8, 10, 14, 18] }
  ]);
}

$('#btn-excel').addEventListener('click', () => {
  if (!S.registos.length) return;
  entregar(construirExcel(S.registos), `cronometro_producao_${carimbo()}.xlsx`);
});

/* ---------- eventos gerais ---------- */
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) mostrar(b.dataset.v); });
$('#btn-novo').addEventListener('click', () => abrirForm('novo'));
$('#lista-crono').addEventListener('click', e => {
  const b = e.target.closest('button[data-acao]'); if (!b) return;
  const t = S.ativos.find(x => x.id === b.closest('.crono').dataset.id); if (!t) return;
  const a = b.dataset.acao;
  if (a === 'pausar') pausar(t);
  if (a === 'retomar') retomar(t);
  if (a === 'editar') abrirForm('editar', t, { id: t.id });
  if (a === 'parar') { const fimTs = Date.now(); abrirForm('parar', t, { id: t.id, ms: decorrido(t, fimTs), fimTs }); }
});
$('#lista-registos').addEventListener('click', e => {
  const b = e.target.closest('button[data-acao]'); if (!b) return;
  const r = S.registos.find(x => x.id === b.closest('li').dataset.id); if (!r) return;
  if (b.dataset.acao === 'editar') abrirForm('registo', r, { id: r.id });
  if (b.dataset.acao === 'repetir') { mostrar('crono'); abrirForm('novo', { produto: r.produto, etapa: r.etapa, pessoas: r.pessoas, unidade: r.unidade, lote: r.lote }); }
  if (b.dataset.acao === 'apagar') {
    if (!confirm(`Apagar o registo de ${r.produto} / ${r.etapa} (${fmtDur(r.duracaoMs)})?`)) return;
    S.registos = S.registos.filter(x => x.id !== r.id); S.apagados.push(r.id); guardar(); render(); toast('Registo apagado');
  }
});
$('#analise').addEventListener('change', e => { if (e.target.id === 'sel-grupo') { grupoSel = e.target.value; renderAnalise(); } });
$('#analise').addEventListener('click', e => {
  const b = e.target.closest('button[data-m]'); if (b) { metrica = b.dataset.m; renderAnalise(); return; }
  const o = e.target.closest('button[data-a="obj"]'); if (!o) return;
  const txt = $('#in-obj').value.trim().replace(/\s/g, '').replace(',', '.');
  if (!txt) { delete S.objetivos[grupoSel]; guardar(); renderAnalise(); toast('Objetivo removido'); return; }
  const v = parseFloat(txt);
  if (!(v > 0)) { toast('O objetivo tem de ser um número maior que zero.'); return; }
  S.objetivos[grupoSel] = { valor: v, unidade: o.dataset.u, alterado: new Date().toISOString() };
  guardar(); renderAnalise(); toast('Objetivo guardado');
});
$('#analise').addEventListener('input', e => {
  if (e.target.id === 'est-qtd') estQtd = e.target.value;
  else if (e.target.id === 'est-pes') estPes = e.target.value;
  else return;
  $('#est-res').innerHTML = calcEstimativa();
});
$('#analise').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'in-obj') { e.preventDefault(); $('#analise [data-a="obj"]').click(); } });

let tToast = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tToast); tToast = setTimeout(() => { t.hidden = true; }, 3800); }

  try { const e = await DB.get('estado'); if (e) S = { ...S, ...e }; } catch { }
  S.registos = S.registos || []; S.ativos = S.ativos || []; S.apagados = S.apagados || []; S.objetivos = S.objetivos || {};

  gerirWakeLock();
